<!DOCTYPE html>

<head>
  <base href="https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logo-container">

  </div>
  
  <div class="menu">
    <a href="javascript:loadChapter(1)" class="row">

    <a href="javascript:loadChapter(2)" class="row">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png">
    </a>
    <a href="javascript:loadChapter(3)" class="row">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png">
    </a>
    <a href="javascript:loadChapter(4)" class="row">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png">
    </a>
    <a href="javascript:alert('Chapter 5 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 5</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:alert('Chapter 6 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:alert('Chapter 7 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:window.open('https://truffled.lol', '_blank')" class="row">
      <span class="chapter"></span>
      <span class="title">port by bog :o</span>
      <span class="badge"></span>
    </a>
  </div>

  <audio id="drone" controls loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    your slow ass browser doesnt support AUDIO?
  </audio>
  <button id="mute">🔊</button>

  <!-- Persistent Save Backup & Restore UI -->
  <div id="save-manager-ui" style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; font-family: sans-serif; color: white; border: 1px solid #444; min-width: 160px;">
    <div style="font-size: 10px; color: #888; font-weight: bold; margin-bottom: 6px; text-align: right; letter-spacing: 0.5px;">SAVE MANAGER v1.2</div>
    <button onclick="exportAllSaves()" style="margin-bottom: 6px; width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; background: #22c55e; color: white; border: none;">📦 Export Zip Save</button>
    <br>
    <input type="file" id="importAllInput" accept=".zip" style="display:none" onchange="importAllSaves(this)">
    <button onclick="document.getElementById('importAllInput').click()" style="width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; background: #3b82f6; color: white; border: none;">📥 Import Zip Save</button>
  </div>

  <script>
    // Load JSZip library safely
    (function loadJSZipLibrary() {
      const jszipScript = document.createElement('script');
      jszipScript.src = new URL('jszip.min.js', window.location.href).href;
      jszipScript.onerror = function() {
        const fallback = document.createElement('script');
        fallback.src = 'https://cdn.jsdelivr.net/gh/FunkinOnAFridayNight/deltarune@main/jszip.min.js';
        document.head.appendChild(fallback);
      };
      document.head.appendChild(jszipScript);
    })();

    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    let gamestarted = false;
  
    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton(); 
      }
    });
  
    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? '🔊' : '🔇';
      }
    }
  
    updateButton();

    function loadChapter(chapter) {
      const saveUI = document.getElementById('save-manager-ui');
      
      fetch(`chapter${chapter}/index.html`).then(res => res.text()).then(html => {
        gamestarted = true;
        document.documentElement.innerHTML = html;
        
        if (saveUI) {
          document.body.appendChild(saveUI);
        }

        document.documentElement.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
    }

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    
    document.querySelectorAll('.row').forEach(row => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play();
          if (selectedChapter !== null && document.querySelectorAll('.row')[selectedChapter]) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          }
        }
      });
      row.addEventListener('click', () => {
        if (!gamestarted) {
          menuselectaudio.play();
        }
      });
    });

    let selectedChapter = null;
    document.addEventListener('keydown', function(event) {
      if (!gamestarted) {
        const rows = document.querySelectorAll('.row');
        if (event.key === 'ArrowUp') {
          if (selectedChapter === null) {
            selectedChapter = 0;
            rows[0].classList.add("selected");
            menumoveaudio.play();
          } else {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter--;
            if (selectedChapter < 0) {
              selectedChapter = rows.length - 1;
            }
            rows[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        } else if (event.key === 'ArrowDown') {
          if (selectedChapter === null) {
            selectedChapter = 0;
            rows[0].classList.add("selected");
            menumoveaudio.play();
          } else {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter++;
            if (selectedChapter >= rows.length) {
              selectedChapter = 0;
            }
            rows[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        } else if (event.key === 'Enter') {
          if (selectedChapter !== null && rows[selectedChapter]) {
            rows[selectedChapter].click();
          } 
        }
      }
    });

    const DELTARUNE_FILES = [
      'dr.ini',
      'filech1_0', 'filech1_1', 'filech1_2', 'filech1_3', 'filech1_4', 'filech1_5',
      'filech2_0', 'filech2_1', 'filech2_2', 'filech2_3', 'filech2_4', 'filech2_5',
      'filech3_0', 'filech3_1', 'filech3_2', 'filech3_3', 'filech3_4', 'filech3_5',
      'filech4_0', 'filech4_1', 'filech4_2', 'filech4_3', 'filech4_4', 'filech4_5'
    ];

    // Opens or initializes the Emscripten IndexedDB instance
    function getIndexedDBStore() {
      return new Promise((resolve) => {
        const request = indexedDB.open('/idbfs', 1);
        request.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('FILE_DATA')) {
            db.createObjectStore('FILE_DATA');
          }
        };
        request.onsuccess = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('FILE_DATA')) {
            db.close();
            return resolve(null);
          }
          resolve(db);
        };
        request.onerror = function() {
          resolve(null);
        };
      });
    }

    // Writes raw file bytes into IndexedDB
    async function writeToIndexedDB(fileName, textContent) {
      const db = await getIndexedDBStore();
      if (!db) return;

      return new Promise((resolve) => {
        const tx = db.transaction(['FILE_DATA'], 'readwrite');
        const store = tx.objectStore('FILE_DATA');
        const encoder = new TextEncoder();
        const uint8Data = encoder.encode(textContent);

        const pathVariations = [
          '/' + fileName,
          fileName,
          '/home/web_user/gamedata/' + fileName,
          '/working/' + fileName
        ];

        pathVariations.forEach(pathKey => {
          store.put({
            timestamp: new Date(),
            mode: 33206,
            contents: uint8Data
          }, pathKey);
        });

        tx.oncomplete = function() { db.close(); resolve(); };
        tx.onerror = function() { db.close(); resolve(); };
      });
    }

    // Export function
    async function exportAllSaves() {
      if (typeof JSZip === 'undefined') {
        alert("Zip library is loading. Please wait 3 seconds and try again.");
        return;
      }

      const zip = new JSZip();
      let foundCount = 0;

      const activeFS = typeof FS !== 'undefined' ? FS : (window.Module && window.Module.FS ? window.Module.FS : null);

      if (activeFS) {
        DELTARUNE_FILES.forEach(filename => {
          try {
            const content = activeFS.readFile('/' + filename, { encoding: 'utf8' });
            if (content && content.length > 0) {
              zip.file(filename, content);
              foundCount++;
            }
          } catch (err) {}
        });
      }

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        const cleanName = key.split('/').pop();
        
        if (value && value.length > 0 && !zip.file(cleanName)) {
          zip.file(cleanName, value);
          foundCount++;
        }
      }

      if (foundCount === 0) {
        alert("No save files found! Make sure you walk up to a yellow Save Point star in-game and save first.");
        return;
      }

      const zipBlob = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipBlob);
      link.download = 'deltarune_saves.zip';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Import function
    async function importAllSaves(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      if (typeof JSZip === 'undefined') {
        alert("Zip library is loading. Please wait 3 seconds and try again.");
        return;
      }

      try {
        const zip = await JSZip.loadAsync(file);
        let importedCount = 0;
        let importedNames = [];

        for (const relativePath of Object.keys(zip.files)) {
          const zipEntry = zip.files[relativePath];
          if (zipEntry.dir) continue;

          const fileName = relativePath.split('/').pop();
          if (!fileName) continue;

          const content = await zipEntry.async('string');

          // 1. Save to LocalStorage under multiple path prefixes
          localStorage.setItem(fileName, content);
          localStorage.setItem('/' + fileName, content);
          localStorage.setItem('GMS2_' + fileName, content);

          // 2. Save directly to IndexedDB (/idbfs)
          await writeToIndexedDB(fileName, content);

          // 3. Save to active Emscripten FS if game is running
          const activeFS = typeof FS !== 'undefined' ? FS : (window.Module && window.Module.FS ? window.Module.FS : null);
          if (activeFS) {
            try {
              activeFS.writeFile('/' + fileName, content);
              activeFS.writeFile(fileName, content);
            } catch (err) {}
          }

          importedCount++;
          importedNames.push(fileName);
        }

        if (importedCount === 0) {
          alert("No valid files found inside this ZIP archive.");
          return;
        }

        const activeFS = typeof FS !== 'undefined' ? FS : (window.Module && window.Module.FS ? window.Module.FS : null);
        if (activeFS && activeFS.syncfs) {
          activeFS.syncfs(false, function() {
            alert(`Imported ${importedCount} file(s): (${importedNames.join(', ')})!\nReloading page now...`);
            location.reload();
          });
        } else {
          alert(`Imported ${importedCount} file(s): (${importedNames.join(', ')})!\nReloading page now...`);
          location.reload();
        }
      } catch (err) {
        alert("Error parsing ZIP file: " + err.message);
      }
    }
  </script>
</body>
</html>
