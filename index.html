<!DOCTYPE html>
<html>
<head>
  <base href="https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo">
  </div>
  
  <div class="menu">
    <a href="javascript:loadChapter(1)" class="row">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png">
    </a>
    <a href="javascript:loadChapter(2)" class="row">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png">
    </a>
    <a href="javascript:loadChapter(3)" class="row">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png">
    </a>
    <a href="javascript:loadChapter(4)" class="row">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png">
    </a>
    <a href="javascript:alert('Chapter 5 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 5</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:alert('Chapter 6 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:alert('Chapter 7 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png">
    </a>
    <a href="javascript:window.open('https://truffled.lol', '_blank')" class="row">
      <span class="chapter"></span>
      <span class="title">port by bog :o</span>
      <span class="badge"></span>
    </a>
  </div>

  <audio id="drone" controls loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    your slow ass browser doesnt support AUDIO?
  </audio>
  <button id="mute">🔊</button>

  <!-- Deltarune Full Save Backup & Restore UI -->
  <div style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; font-family: sans-serif; color: white;">
    <button onclick="exportAllSaves()" style="margin-bottom: 5px; width: 100%; padding: 6px; cursor: pointer; border-radius: 4px;">📦 Export All Saves</button>
    <br>
    <input type="file" id="importAllInput" accept=".json" style="display:none" onchange="importAllSaves(this)">
    <button onclick="document.getElementById('importAllInput').click()" style="width: 100%; padding: 6px; cursor: pointer; border-radius: 4px;">📥 Import All Saves</button>
  </div>

  <script>
    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    let gamestarted = false;
  
    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton(); 
      }
    });
  
    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? '🔊' : '🔇';
      }
    }
  
    updateButton();

    function loadChapter(chapter) {
      fetch(`chapter${chapter}/index.html`).then(res => res.text()).then(html => {
        gamestarted = true;
        document.documentElement.innerHTML = html;
        document.documentElement.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
    }

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    
    document.querySelectorAll('.row').forEach(row => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play();
          if (selectedChapter !== null && document.querySelectorAll('.row')[selectedChapter]) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          }
        }
      });
      row.addEventListener('click', () => {
        if (!gamestarted) {
          menuselectaudio.play();
        }
      });
    });

    let selectedChapter = null;
    document.addEventListener('keydown', function(event) {
      if (!gamestarted) {
        const rows = document.querySelectorAll('.row');
        if (event.key === 'ArrowUp') {
          if (selectedChapter === null) {
            selectedChapter = 0;
            rows[0].classList.add("selected");
            menumoveaudio.play();
          } else {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter--;
            if (selectedChapter < 0) {
              selectedChapter = rows.length - 1;
            }
            rows[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        } else if (event.key === 'ArrowDown') {
          if (selectedChapter === null) {
            selectedChapter = 0;
            rows[0].classList.add("selected");
            menumoveaudio.play();
          } else {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter++;
            if (selectedChapter >= rows.length) {
              selectedChapter = 0;
            }
            rows[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        } else if (event.key === 'Enter') {
          if (selectedChapter !== null && rows[selectedChapter]) {
            rows[selectedChapter].click();
          } 
        }
      }
    });

    // Integrated Universal Save Export/Import logic
    const DELTARUNE_FILES = [
      'dr.ini',
      'filech1_0', 'filech1_1', 'filech1_2', 'filech1_3', 'filech1_4', 'filech1_5',
      'filech2_0', 'filech2_1', 'filech2_2', 'filech2_3', 'filech2_4', 'filech2_5',
      'filech3_0', 'filech3_1', 'filech3_2', 'filech3_3', 'filech3_4', 'filech3_5',
      'filech4_0', 'filech4_1', 'filech4_2', 'filech4_3', 'filech4_4', 'filech4_5'
    ];

    function exportAllSaves() {
      const backupData = {};
      let foundCount = 0;

      // Check Emscripten Virtual File System if active
      if (typeof FS !== 'undefined') {
        DELTARUNE_FILES.forEach(filename => {
          try {
            const content = FS.readFile('/' + filename, { encoding: 'utf8' });
            backupData[filename] = content;
            foundCount++;
          } catch (err) {}
        });
      }

      // Fallback/Supplement with LocalStorage keys
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (DELTARUNE_FILES.includes(key) || key.startsWith('filech') || key.startsWith('dr.')) {
          backupData[key] = localStorage.getItem(key);
          foundCount++;
        }
      }

      if (foundCount === 0) {
        alert("No save files found! Make sure you have saved in-game first.");
        return;
      }

      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'deltarune_all_saves.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function importAllSaves(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const backupData = JSON.parse(e.target.result);
          let importedCount = 0;

          for (const [filename, content] of Object.entries(backupData)) {
            // Write to LocalStorage
            localStorage.setItem(filename, content);

            // Write to Emscripten FS if loaded
            if (typeof FS !== 'undefined') {
              try {
                FS.writeFile('/' + filename, content);
              } catch (err) {}
            }
            importedCount++;
          }

          if (typeof FS !== 'undefined' && FS.syncfs) {
            FS.syncfs(false, function(err) {
              alert(`Successfully imported ${importedCount} save file(s)! Reloading page...`);
              location.reload();
            });
          } else {
            alert(`Successfully imported ${importedCount} save file(s)! Reloading page...`);
            location.reload();
          }
        } catch (err) {
          alert("Invalid backup file format. Please select a valid deltarune_all_saves.json file.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
