  <audio id="drone" controls loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    your slow ass browser doesnt support AUDIO?
  </audio>
  <button id="mute">🔊</button>
  <script>
    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    let gamestarted = false;
  
    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton(); 
      }
    });
  
    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? '🔊' : '🔇';
      }
    }
  
    updateButton();

    function loadChapter(chapter) {
      fetch(`chapter${chapter}/index.html`).then(res => res.text()).then(html => {
        gamestarted = true;
        document.documentElement.innerHTML = html;
        document.documentElement.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
    }

    const hoverSound = document.getElementById('hover-sound');

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    document.querySelectorAll('.row').forEach(row => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play();
          if (selectedChapter) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          }
        }
      });
      row.addEventListener('click', () => {
        if (!gamestarted) {
          menuselectaudio.play();
        }
      });
    });

    let selectedChapter = null;
    document.addEventListener('keydown', function(event) {
      if (!gamestarted) {
      if (event.key === 'ArrowUp') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll('.row')[0].classList.add("selected");
          menumoveaudio.play();
        } else {
          document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          selectedChapter--;
          if (selectedChapter < 0) {
            selectedChapter = document.querySelectorAll('.row').length - 1;
          }
          document.querySelectorAll('.row')[selectedChapter].classList.add("selected");
          menumoveaudio.play();
        }
      } else if (event.key === 'ArrowDown') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll('.row')[0].classList.add("selected");
          menumoveaudio.play();
        } else {
          if (selectedChapter+1 >= document.querySelectorAll('.row').length) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
            selectedChapter = 0;
            document.querySelectorAll('.row')[0].classList.add("selected");
            menumoveaudio.play();
          } else {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
            selectedChapter++;
            document.querySelectorAll('.row')[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        }
      } else if (event.key === 'Enter') {
        if (selectedChapter !== null) {
          window.location.href = document.querySelectorAll('.row')[selectedChapter].href;
          menuselectaudio.play();
        } 
      }
      }
    });
  </script>
</body>
<!-- Deltarune Full Save Backup & Restore UI -->
<div style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; font-family: sans-serif; color: white;">
  <button onclick="exportAllSaves()" style="margin-bottom: 5px; width: 100%; padding: 6px; cursor: pointer;">📦 Export All Saves</button>
  <br>
  <input type="file" id="importAllInput" accept=".json" style="display:none" onchange="importAllSaves(this)">
  <button onclick="document.getElementById('importAllInput').click()" style="width: 100%; padding: 6px; cursor: pointer;">📥 Import All Saves</button>
</div>

<script>
// List of all known Deltarune save files across chapters
const DELTARUNE_FILES = [
  'dr.ini',
  'filech1_0', 'filech1_1', 'filech1_2', 'filech1_3', 'filech1_4', 'filech1_5',
  'filech2_0', 'filech2_1', 'filech2_2', 'filech2_3', 'filech2_4', 'filech2_5'
];

function exportAllSaves() {
  const backupData = {};
  let foundCount = 0;

  DELTARUNE_FILES.forEach(filename => {
    try {
      const content = FS.readFile('/' + filename, { encoding: 'utf8' });
      backupData[filename] = content;
      foundCount++;
    } catch (err) {
      // File doesn't exist yet in VFS, skip it
    }
  });

  if (foundCount === 0) {
    alert("No save files found! Make sure you have saved in-game first.");
    return;
  }

  // Package all saves into a single JSON file to bypass Chrome OS multiple-download blocks
  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'deltarune_all_saves.json';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function importAllSaves(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const backupData = JSON.parse(e.target.result);
      let importedCount = 0;

      for (const [filename, content] of Object.entries(backupData)) {
        FS.writeFile('/' + filename, content);
        importedCount++;
      }

      FS.syncfs(false, function(err) {
        if (err) {
          alert("Error syncing to storage.");
        } else {
          alert(`Successfully imported ${importedCount} save file(s)! Reloading page...`);
          location.reload();
        }
      });
    } catch (err) {
      alert("Invalid backup file format. Please select a valid deltarune_all_saves.json file.");
    }
  };
  reader.readAsText(file);
}
</script>
</script>
