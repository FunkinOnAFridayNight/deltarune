<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Web Port (Chapters 1-4)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Save Manager Overlay Panel styles */
        .save-manager-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(17, 17, 17, 0.95);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #ffffff;
            padding: 15px;
            border-radius: 4px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 320px;
        }
        .save-manager-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #ffd700;
            text-transform: uppercase;
            border-bottom: 1px dashed #fff;
            padding-bottom: 5px;
        }
        .save-group {
            margin-bottom: 12px;
        }
        .save-group label {
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
            color: #bbb;
        }
        .save-btn {
            background: #222;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-right: 5px;
            margin-top: 3px;
            transition: all 0.2s ease;
        }
        .save-btn:hover {
            background: #ffd700;
            color: #000;
        }
        .file-input-wrapper {
            margin-top: 5px;
        }
        .file-input-wrapper input[type="file"] {
            font-size: 11px;
            color: #fff;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <!-- Main Web Port Frame Navigation (technonyte00 base structure) -->
    <div id="game-container">
        <h1>DELTARUNE Web Port</h1>
        <p>Select a chapter to begin playing:</p>
        <div class="chapter-select">
            <a href="chapter1/index.html" class="chapter-link">Chapter 1</a>
            <a href="chapter2/index.html" class="chapter-link">Chapter 2</a>
            <a href="chapter3/index.html" class="chapter-link">Chapter 3</a>
            <a href="chapter4/index.html" class="chapter-link">Chapter 4</a>
        </div>
    </div>

    <!-- INJECTED SAVE MANAGER PANEL -->
    <div class="save-manager-panel">
        <h3>Save File Utility</h3>
        
        <!-- EXPORT UTILITY -->
        <div class="save-group">
            <label>Export Save State to PC:</label>
            <button class="save-btn" onclick="exportWebSave('filech3_0')">Ch 3 (Slot 1)</button>
            <button class="save-btn" onclick="exportWebSave('filech4_0')">Ch 4 (Slot 1)</button>
        </div>
        
        <!-- IMPORT UTILITY -->
        <div class="save-group">
            <label>Import Native Save File:</label>
            <div class="file-input-wrapper">
                <input type="file" id="deltaruneSaveLoader" accept="*/*"><br>
                <button class="save-btn" style="width: 100%; margin-top: 8px;" onclick="importNativeSave()">Load Into Browser</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Pulls local data out of the standard GameMaker HTML5 localStorage pipeline 
         * and triggers a local file download naming layout compatible with %LocalAppData%/DELTARUNE
         */
        function exportWebSave(saveFileName) {
            // technonyte00's port uses a truffled canvas engine wrapper. 
            // Standard web engine keys are mapped as direct file items or prefixed via local variables.
            const targetKey = saveFileName; 
            const rawSaveData = localStorage.getItem(targetKey);
            
            if (!rawSaveData) {
                alert("No active browser save found for " + saveFileName + ".\nMake sure you've saved in-game first!");
                return;
            }
            
            const fileBlob = new Blob([rawSaveData], { type: "text/plain" });
            const temporaryAnchor = document.createElement("a");
            temporaryAnchor.href = URL.createObjectURL(fileBlob);
            temporaryAnchor.download = saveFileName; // Explicitly outputs as "filech3_0" or "filech4_0"
            temporaryAnchor.click();
            URL.revokeObjectURL(temporaryAnchor.href);
        }

        /**
         * Reads a local filechX_X save object uploaded from your PC computer 
         * and mirrors it straight into the web client's active storage engine
         */
        function importNativeSave() {
            const inputElement = document.getElementById('deltaruneSaveLoader');
            if (inputElement.files.length === 0) {
                alert("Please select a standard Deltarune file (e.g., filech3_0) to upload.");
                return;
            }
            
            const targetedFile = inputElement.files[0];
            const parsedName = targetedFile.name; // Stores string layout reference matching file entry
            
            // Safety confirmation to make sure user isn't overriding key directories by mistake
            if (!parsedName.startsWith("filech")) {
                if (!confirm("This file doesn't match standard naming formats (filechX_X). Upload anyway?")) {
                    return;
                }
            }
            
            const fileReader = new FileReader();
            fileReader.onload = function(event) {
                const embeddedString = event.target.result;
                
                // Write data back to local sandbox storage state 
                localStorage.setItem(parsedName, embeddedString);
                
                alert("Successfully loaded " + parsedName + " into your browser storage!\nLaunch or refresh your target chapter to load your progress.");
            };
            
            fileReader.readAsText(targetedFile);
        }
    </script>
</body>
</html>
